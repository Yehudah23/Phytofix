<header class="site-header">
	<a class="site-brand" routerLink="/" aria-label="Phytofix home">
		<img class="brand-mark" src="/phtofix%202.PNG" alt="Phytofix" />
	</a>

	<nav class="site-nav" aria-label="Main navigation">
		<a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
		<a routerLink="/products" routerLinkActive="active">Products</a>
		<a routerLink="/about" routerLinkActive="active">About us</a>
		<a routerLink="/team" routerLinkActive="active">The team</a>
		<a routerLink="/contact" routerLinkActive="active">Contact</a>
	</nav>

	<div class="site-actions">
		@if (auth.currentUser()) {
			<a class="nav-dashboard" routerLink="/dashboard">Dashboard</a>
			<a class="nav-cart" routerLink="/cart">Cart@if (cart.count() > 0) {<span class="cart-badge">{{ cart.count() }}</span>}</a>
			@if (admin.isAdmin()) {
				<a class="nav-admin" routerLink="/admin">Admin</a>
			}
			<button class="nav-signout" type="button" (click)="signOut()">Sign out</button>
		} @else {
			<a class="nav-signin" routerLink="/signin">Sign in</a>
			<a class="nav-cta" routerLink="/signup">Start your routine <span aria-hidden="true">↗</span></a>
		}
	</div>
</header>

<router-outlet />
<app-footer />
